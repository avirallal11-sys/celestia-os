# Celestia 1.0 - Boot Logo Description
# This file describes the boot logo configuration

# Logo Settings
logo.width=512
logo.height=512
logo.format=PNG

# Colors
logo.background=#0A0A1A
logo.accent=#00D4FF
logo.text=#00D4FF
logo.star=#FFFFFF

# Animation
logo.fade_in=true
logo.fade_duration=1000
logo.glow_effect=true
logo.glow_color=#00D4FF
logo.glow_radius=20

# Text
logo.text="CELESTIA"
logo.text_size=48
logo.text_font=sans-serif-bold
logo.text_spacing=0.1

# Star effect
logo.star_count=1
logo.star_size=40
logo.star_glow=true
